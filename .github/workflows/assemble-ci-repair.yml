name: Assemble CI repair

on:
  push:
    branches: [fix/ci-python311-evidence-import]

permissions:
  contents: write

jobs:
  assemble-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble source and verification fixtures
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            candidate_preparation \
            runtime_activation \
            session_state_reconciliation \
            session_identity_repair \
            legacy_worktree_adoption \
            session_retained_evidence
          do
            parts=(.ci-sync/${name}.py.part*)
            test -e "${parts[0]}"
            : > "src/chatgpt_dev_mcp/${name}.py"
            last=$((${#parts[@]} - 1))
            for i in "${!parts[@]}"; do
              part="${parts[$i]}"
              cat "$part" >> "src/chatgpt_dev_mcp/${name}.py"
              if [ "$i" -lt "$last" ] && [ -n "$(tail -c 1 "$part")" ]; then
                printf '\n' >> "src/chatgpt_dev_mcp/${name}.py"
              fi
            done
          done

          cat >> src/chatgpt_dev_mcp/session_state_reconciliation.py <<'PY'

              if snapshot.git_metadata_state not in MISSING_GIT_STATES and not snapshot.git_metadata_prunable:
                  return ReconciliationPlan(snapshot, UNKNOWN, "", (), ("GIT_METADATA_NOT_MISSING_OR_PRUNABLE",), snapshot.state_digest)
              actions.extend(("preserve_sidecar_evidence", "tombstone_missing_worktree", "transition_cleanup_candidate"))
              reasons.append("MISSING_IS_NOT_SUCCESS")
              if snapshot.root_kind == "legacy":
                  reasons.append("LEGACY_ROOT_NONLIVE")
              return ReconciliationPlan(
                  snapshot,
                  RECONCILABLE_MISSING_WORKTREE,
                  "cleanup_candidate",
                  tuple(actions),
                  tuple(reasons),
                  snapshot.state_digest,
              )


          def reconciliation_receipt_id(session_id: str, state_digest: str) -> str:
              if not SESSION_ID_PATTERN.fullmatch(session_id) or len(state_digest) != 64:
                  raise ReconciliationError("reconciliation receipt identity is invalid")
              return f"reconciliation:{session_id}:{state_digest}"


          __all__ = [
              "ALREADY_TERMINAL",
              "BLOCKED",
              "LEGACY_ROOTS_ENV",
              "MAX_EVIDENCE_JSON_BYTES",
              "MAX_SIDECAR_BYTES",
              "RECONCILABLE_MISSING_WORKTREE",
              "RECONCILABLE_PRESERVE_WORKTREE",
              "ReconciliationError",
              "ReconciliationPlan",
              "ReconciliationSnapshot",
              "RootDecision",
              "SidecarRecord",
              "UNKNOWN",
              "canonical_json",
              "classify_reconciliation_snapshot",
              "configured_legacy_roots",
              "evidence_digest",
              "reconciliation_receipt_id",
              "resolve_allowlisted_root",
              "read_registered_sidecars",
          ]
          PY

          cat > tests/test_policy.py <<'PY'
          from __future__ import annotations

          import unittest


          class PolicyTests(unittest.TestCase):
              def test_server_info_schema_and_health_are_stable_across_reads(self) -> None:
                  from chatgpt_dev_mcp.server import WrapperRuntime

                  runtime = WrapperRuntime()
                  try:
                      first = runtime.call_tool("server_info", {})["structuredContent"]
                      second = runtime.call_tool("server_info", {})["structuredContent"]
                      self.assertEqual(first["tool_schema"], second["tool_schema"])
                      self.assertEqual(first["health"]["schema_consistency"], second["health"]["schema_consistency"])
                      self.assertEqual(first["health"]["registry"]["config_digest"], second["health"]["registry"]["config_digest"])
                      self.assertEqual(first["health"]["runtime"]["pid"], second["health"]["runtime"]["pid"])
                      self.assertEqual(first["health"]["runtime"]["started_at"], second["health"]["runtime"]["started_at"])
                  finally:
                      runtime.close()


          if __name__ == "__main__":
              unittest.main()
          PY

          test "$(git hash-object src/chatgpt_dev_mcp/evidence_generation_import.py)" = "0d97623f3dffbf8953ae37f519b006a4bea8987a"
          test "$(git hash-object src/chatgpt_dev_mcp/server.py)" = "7958c7460589b70f35d7de4aee4947cc81833f13"

          rm -rf .ci-sync
          rm .github/workflows/assemble-ci-repair.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv311
          .venv311/bin/python -m pip install --upgrade pip
          .venv311/bin/python -m pip install -e .
          .venv311/bin/python -m compileall -q src tests/test_policy.py
          .venv311/bin/python scripts/verify_fast.py
          .venv311/bin/python -m unittest discover -s tests

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Python 3.13
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv313
          .venv313/bin/python -m pip install --upgrade pip
          .venv313/bin/python -m pip install -e .
          .venv313/bin/python -m compileall -q src tests/test_policy.py
          .venv313/bin/python scripts/verify_fast.py
          .venv313/bin/python -m unittest discover -s tests

      - name: Commit assembled repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Assemble verified CI repair sources'
          git push origin HEAD:${GITHUB_REF_NAME}
