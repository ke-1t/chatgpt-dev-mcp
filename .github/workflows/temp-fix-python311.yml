name: Temporary Python 3.11 source fix

on:
  push:
    branches:
      - fix/ci-python311-evidence-import

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-python311-evidence-import
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch Python 3.11-incompatible nested f-string
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/chatgpt_dev_mcp/server.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          changed = 0
          out = []
          for line in lines:
              if (
                  'expected_tree_id = f"worktree:' in line
                  and "sha256_text(f'canonical" in line
                  and 'entry.identifier' in line
                  and '{root}' in line
              ):
                  indent = line[: len(line) - len(line.lstrip())]
                  out.append(indent + 'canonical_tree_identity = f"canonical\\0{entry.identifier}\\0{root}"\n')
                  out.append(indent + 'expected_tree_id = f"worktree:{sha256_text(canonical_tree_identity)[:32]}"\n')
                  changed += 1
              else:
                  out.append(line)
          if changed != 1:
              raise SystemExit(f'expected exactly one nested f-string target, found {changed}')
          path.write_text(''.join(out), encoding='utf-8')
          PY
          python -m py_compile src/chatgpt_dev_mcp/server.py
          git diff --check
      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-fix-python311.yml
          git add src/chatgpt_dev_mcp/server.py
          git commit -m 'Fix Python 3.11 nested f-string'
          git push origin HEAD:fix/ci-python311-evidence-import
